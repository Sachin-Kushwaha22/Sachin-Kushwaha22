<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="barGlow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ambientBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="badgeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.3px; }
    .subtitle { font-size: 13.5px; fill: #94A3B8; }
    .label { font-size: 14px; fill: #F8FAFC; font-weight: 500; }
    .value { font-size: 16px; font-weight: 700; }
    .icon { font-size: 17px; }
    .stackLabel { font-size: 11.5px; fill: #94A3B8; letter-spacing: 2px; font-weight: 600; }
    .xpText { font-size: 14px; fill: #F8FAFC; font-weight: 700; }
    .levelText { font-size: 13px; fill: #0F172A; font-weight: 800; letter-spacing: 0.5px; }
    .pctText { font-size: 13px; fill: #FBBF24; font-weight: 800; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rowFade { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes breatheSoft { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
    @keyframes badgeBreathe { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes pulseDot { 0%, 100% { opacity: 0.4; r: 3; } 50% { opacity: 1; r: 5; } }
    @keyframes sheenMove { 0% { transform: translateX(-120px); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateX(120px); opacity: 0; } }

    .card-anim { opacity: 0; animation: fadeIn 1s ease-out forwards; }
    .header-anim { opacity: 0; animation: slideDown 0.9s cubic-bezier(.22,1,.36,1) forwards; animation-delay: 0.25s; }
    .border-breathe { animation: breathe 4.5s ease-in-out infinite; animation-delay: 1.6s; }
    .glow-breathe { animation: breatheSoft 5s ease-in-out infinite; }
    .row-in { opacity: 0; animation: rowFade 0.65s ease-out forwards; }
    .particle { animation: floaty 6s ease-in-out infinite; }
    .sheen { animation: sheenMove 5s ease-in-out infinite; animation-delay: 2s; }
    .panel-in { opacity: 0; animation: panelIn 0.7s ease-out forwards; }
    .badge-glow { animation: badgeBreathe 3.2s ease-in-out infinite; animation-delay: 2.6s; transform-origin: 130px 424px; }
    .status-dot { animation: pulseDot 1.8s ease-in-out infinite; animation-delay: 1.9s; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#111827"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- Ambient glow blobs -->
  <circle cx="120" cy="80" r="150" fill="#60A5FA" opacity="0.08" filter="url(#ambientBlur)" class="glow-breathe"/>
  <circle cx="800" cy="440" r="170" fill="#06B6D4" opacity="0.08" filter="url(#ambientBlur)" class="glow-breathe" style="animation-delay:1.2s"/>
  <circle cx="820" cy="60" r="120" fill="#FBBF24" opacity="0.05" filter="url(#ambientBlur)" class="glow-breathe" style="animation-delay:0.6s"/>

  <!-- Floating particles -->
  <circle class="particle" cx="90" cy="440" r="2" fill="#60A5FA" opacity="0.5" style="animation-delay:0s"/>
  <circle class="particle" cx="830" cy="120" r="1.6" fill="#06B6D4" opacity="0.45" style="animation-delay:1.1s"/>
  <circle class="particle" cx="770" cy="380" r="2.2" fill="#FBBF24" opacity="0.4" style="animation-delay:2.3s"/>
  <circle class="particle" cx="140" cy="90" r="1.5" fill="#94A3B8" opacity="0.4" style="animation-delay:0.7s"/>
  <circle class="particle" cx="60" cy="250" r="1.8" fill="#38BDF8" opacity="0.35" style="animation-delay:1.8s"/>
  <circle class="particle" cx="860" cy="260" r="1.6" fill="#60A5FA" opacity="0.4" style="animation-delay:3s"/>
  <circle class="particle" cx="450" cy="20" r="1.4" fill="#06B6D4" opacity="0.35" style="animation-delay:2.6s"/>

  <!-- Card group -->
  <g class="card-anim">
    <rect x="40" y="30" width="820" height="440" rx="22" fill="none" stroke="#38BDF8" stroke-width="3" filter="url(#softGlow)" opacity="0.55" class="border-breathe"/>
    <rect x="40" y="30" width="820" height="440" rx="22" fill="url(#cardGrad)"/>
    <rect x="40" y="30" width="820" height="440" rx="22" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="41" y="31" width="818" height="2" rx="1" fill="url(#topSheen)" class="sheen"/>

    <!-- HEADER -->
    <g class="header-anim">
      <text x="70" y="76" class="title">Developer Achievements</text>
      <text x="70" y="99" class="subtitle">Milestones &amp; GitHub Progress</text>
      <line x1="70" y1="122" x2="830" y2="122" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>
    </g>

    <!-- BODY: achievement rows -->
    <!-- Total Stars -->
    <g class="row-in" style="animation-delay:0.60s">
      <rect x="60" y="142" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="164" class="icon">⭐</text>
      <text x="112" y="164" class="label">Total Stars</text>
      <text x="778" y="164" class="value" text-anchor="end" fill="#FBBF24" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:0.95s;">1</text>
    </g>

    <!-- Public Repositories -->
    <g class="row-in" style="animation-delay:0.78s">
      <rect x="60" y="180" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="202" class="icon">📦</text>
      <text x="112" y="202" class="label">Public Repositories</text>
      <text x="778" y="202" class="value" text-anchor="end" fill="#06B6D4" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:1.13s;">20</text>
    </g>

    <!-- Contribution Streak -->
    <g class="row-in" style="animation-delay:0.96s">
      <rect x="60" y="218" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="240" class="icon">🔥</text>
      <text x="112" y="240" class="label">Contribution Streak</text>
      <text x="778" y="240" class="value" text-anchor="end" fill="#38BDF8" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:1.31s;">0 Days</text>
    </g>

    <!-- Pull Requests -->
    <g class="row-in" style="animation-delay:1.14s">
      <rect x="60" y="256" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="278" class="icon">🤝</text>
      <text x="112" y="278" class="label">Pull Requests</text>
      <text x="778" y="278" class="value" text-anchor="end" fill="#60A5FA" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:1.49s;">25</text>
    </g>

    <!-- Followers -->
    <g class="row-in" style="animation-delay:1.32s">
      <rect x="60" y="294" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="316" class="icon">👥</text>
      <text x="112" y="316" class="label">Followers</text>
      <text x="778" y="316" class="value" text-anchor="end" fill="#38BDF8" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:1.67s;">9</text>
    </g>

    <!-- Open Source Status -->
    <g class="row-in" style="animation-delay:1.50s">
      <rect x="60" y="332" width="740" height="32" rx="10" fill="#0F172A" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.15"/>
      <text x="82" y="354" class="icon">🚀</text>
      <text x="112" y="354" class="label">Open Source Status</text>
      <circle cx="700" cy="349" r="4" fill="#22C55E" class="status-dot"/>
      <text x="778" y="354" class="value" text-anchor="end" fill="#22C55E" opacity="0" style="animation:popIn 0.5s ease-out forwards; animation-delay:1.85s;">Active</text>
    </g>

    <line x1="70" y1="378" x2="830" y2="378" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>

    <!-- DEVELOPER LEVEL PANEL -->
    <g class="panel-in" style="animation-delay:1.85s">
      <rect x="60" y="388" width="740" height="72" rx="16" fill="#0F172A" fill-opacity="0.45" stroke="#FBBF24" stroke-opacity="0.35"/>

      <!-- Level badge -->
      <g class="badge-glow">
        <rect x="80" y="404" width="100" height="40" rx="20" fill="url(#goldGrad)" filter="url(#badgeGlow)"/>
      </g>
      <rect x="80" y="404" width="100" height="40" rx="20" fill="url(#goldGrad)"/>
      <text x="130" y="429" class="levelText" text-anchor="middle">LEVEL 3</text>

      <!-- XP labels -->
      <text x="200" y="405" class="stackLabel">XP PROGRESS</text>
      <text x="778" y="407" class="xpText" text-anchor="end">605 / 1000 XP</text>

      <!-- XP bar track -->
      <rect x="200" y="414" width="578" height="10" rx="5" fill="#0F172A" fill-opacity="0.6"/>

      <!-- XP bar fill -->
      <rect x="200" y="414" width="0" height="10" rx="5" fill="url(#xpGrad)" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="349.69" begin="2.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>

      <!-- Glowing progress indicator dot -->
      <circle cx="200" cy="419" r="0" fill="#FBBF24" filter="url(#softGlow)">
        <animate attributeName="r" from="0" to="5" begin="2.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
        <animate attributeName="cx" from="200" to="549.69" begin="2.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </circle>

      <!-- Glowing percentage indicator -->
      <text x="442.76" y="405" class="pctText" text-anchor="middle" opacity="0">
        60.5%
        <set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
