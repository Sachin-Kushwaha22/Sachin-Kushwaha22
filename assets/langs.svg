<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Card glass gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="barGlow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="pillGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.3px; }
    .subtitle { font-size: 13.5px; fill: #94A3B8; }
    .label { font-size: 14px; fill: #F8FAFC; font-weight: 500; }
    .percent { font-size: 14px; fill: #94A3B8; font-weight: 700; }
    .pillText { font-size: 12.5px; fill: #F8FAFC; font-weight: 600; }
    .stackLabel { font-size: 12px; fill: #94A3B8; letter-spacing: 2px; font-weight: 600; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rowFade { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pillIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes breatheSoft { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes sheenMove { 0% { transform: translateX(-120px); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateX(120px); opacity: 0; } }

    .card-anim { opacity: 0; animation: fadeIn 1s ease-out forwards; }
    .header-anim { opacity: 0; animation: slideDown 0.9s cubic-bezier(.22,1,.36,1) forwards; animation-delay: 0.25s; }
    .border-breathe { animation: breathe 4.5s ease-in-out infinite; animation-delay: 1.6s; }
    .glow-breathe { animation: breatheSoft 5s ease-in-out infinite; }
    .pill { opacity: 0; animation: pillIn 0.55s ease-out forwards; }
    .particle { animation: floaty 6s ease-in-out infinite; }
    .row-in { opacity: 0; animation: rowFade 0.7s ease-out forwards; }
    .sheen { animation: sheenMove 5s ease-in-out infinite; animation-delay: 2s; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="#111827"/>
  <rect x="0" y="0" width="900" height="500" fill="url(#grid)" opacity="0.5"/>

  <!-- Ambient glow blobs -->
  <circle cx="120" cy="80" r="150" fill="#60A5FA" opacity="0.08" filter="url(#ambientBlur)" class="glow-breathe"/>
  <circle cx="800" cy="440" r="170" fill="#06B6D4" opacity="0.08" filter="url(#ambientBlur)" class="glow-breathe" style="animation-delay:1.2s"/>
  <circle cx="820" cy="60" r="120" fill="#38BDF8" opacity="0.06" filter="url(#ambientBlur)" class="glow-breathe" style="animation-delay:0.6s"/>

  <!-- Floating particles -->
  <circle class="particle" cx="90" cy="440" r="2" fill="#60A5FA" opacity="0.5" style="animation-delay:0s"/>
  <circle class="particle" cx="830" cy="120" r="1.6" fill="#06B6D4" opacity="0.45" style="animation-delay:1.1s"/>
  <circle class="particle" cx="770" cy="380" r="2.2" fill="#38BDF8" opacity="0.4" style="animation-delay:2.3s"/>
  <circle class="particle" cx="140" cy="90" r="1.5" fill="#94A3B8" opacity="0.4" style="animation-delay:0.7s"/>
  <circle class="particle" cx="60" cy="250" r="1.8" fill="#38BDF8" opacity="0.35" style="animation-delay:1.8s"/>
  <circle class="particle" cx="860" cy="260" r="1.6" fill="#60A5FA" opacity="0.4" style="animation-delay:3s"/>
  <circle class="particle" cx="450" cy="20" r="1.4" fill="#06B6D4" opacity="0.35" style="animation-delay:2.6s"/>

  <!-- Card group -->
  <g class="card-anim">
    <!-- outer border glow (breathing) -->
    <rect x="40" y="30" width="820" height="440" rx="22" fill="none" stroke="#38BDF8" stroke-width="3" filter="url(#softGlow)" opacity="0.55" class="border-breathe"/>

    <!-- glass card -->
    <rect x="40" y="30" width="820" height="440" rx="22" fill="url(#cardGrad)"/>
    <rect x="40" y="30" width="820" height="440" rx="22" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- top sheen accent -->
    <rect x="41" y="31" width="818" height="2" rx="1" fill="url(#topSheen)" class="sheen"/>

    <!-- HEADER -->
    <g class="header-anim">
      <text x="70" y="76" class="title">Technology Analytics</text>
      <text x="70" y="99" class="subtitle">Languages &amp; Technologies I Build With</text>
      <line x1="70" y1="122" x2="830" y2="122" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>
    </g>

    <!-- BODY: language bars -->
    <!-- JavaScript 40% -->
    <g class="row-in" style="animation-delay:0.55s">
      <text x="70" y="165" class="label">JavaScript</text>
      <rect x="280" y="155" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="155" width="0" height="8" rx="4" fill="#38BDF8" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="206.4" begin="1.0s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="165" class="percent" text-anchor="end" opacity="0">21.5%
        <set attributeName="opacity" to="1" begin="1.0s"/>
        <set attributeName="opacity" to="0" begin="1.4s"/>
      </text>
      <text x="815" y="165" class="percent" text-anchor="end" opacity="0">43.0%
        <set attributeName="opacity" to="1" begin="1.4s"/>
        <set attributeName="opacity" to="0" begin="1.8s"/>
      </text>
      <text x="815" y="165" class="percent" text-anchor="end" opacity="0">64.5%
        <set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
      </text>
    </g>

    <!-- Python 25% -->
    <g class="row-in" style="animation-delay:0.7s">
      <text x="70" y="207" class="label">CSS</text>
      <rect x="280" y="197" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="197" width="0" height="8" rx="4" fill="#06B6D4" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="67.52" begin="1.2s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="207" class="percent" text-anchor="end" opacity="0">7.0%
        <set attributeName="opacity" to="1" begin="1.2s"/>
        <set attributeName="opacity" to="0" begin="1.6s"/>
      </text>
      <text x="815" y="207" class="percent" text-anchor="end" opacity="0">14.1%
        <set attributeName="opacity" to="1" begin="1.6s"/>
        <set attributeName="opacity" to="0" begin="2.0s"/>
      </text>
      <text x="815" y="207" class="percent" text-anchor="end" opacity="0">21.1%
        <set attributeName="opacity" to="1" begin="2.0s" fill="freeze"/>
      </text>
    </g>

    <!-- HTML 15% -->
    <g class="row-in" style="animation-delay:0.85s">
      <text x="70" y="249" class="label">Python</text>
      <rect x="280" y="239" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="239" width="0" height="8" rx="4" fill="#60A5FA" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="18.24" begin="1.4s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="249" class="percent" text-anchor="end" opacity="0">1.9%
        <set attributeName="opacity" to="1" begin="1.4s"/>
        <set attributeName="opacity" to="0" begin="1.8s"/>
      </text>
      <text x="815" y="249" class="percent" text-anchor="end" opacity="0">3.8%
        <set attributeName="opacity" to="1" begin="1.8s"/>
        <set attributeName="opacity" to="0" begin="2.2s"/>
      </text>
      <text x="815" y="249" class="percent" text-anchor="end" opacity="0">5.7%
        <set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
      </text>
    </g>

    <!-- CSS 10% -->
    <g class="row-in" style="animation-delay:1.0s">
      <text x="70" y="291" class="label">HTML</text>
      <rect x="280" y="281" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="281" width="0" height="8" rx="4" fill="#38BDF8" fill-opacity="0.85" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="12.48" begin="1.6s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="291" class="percent" text-anchor="end" opacity="0">1.3%
        <set attributeName="opacity" to="1" begin="1.6s"/>
        <set attributeName="opacity" to="0" begin="2.0s"/>
      </text>
      <text x="815" y="291" class="percent" text-anchor="end" opacity="0">2.6%
        <set attributeName="opacity" to="1" begin="2.0s"/>
        <set attributeName="opacity" to="0" begin="2.4s"/>
      </text>
      <text x="815" y="291" class="percent" text-anchor="end" opacity="0">3.9%
        <set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
      </text>
    </g>

    <!-- TypeScript 5% -->
    <g class="row-in" style="animation-delay:1.15s">
      <text x="70" y="333" class="label">C++</text>
      <rect x="280" y="323" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="323" width="0" height="8" rx="4" fill="#06B6D4" fill-opacity="0.85" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="12.48" begin="1.8s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="333" class="percent" text-anchor="end" opacity="0">1.3%
        <set attributeName="opacity" to="1" begin="1.8s"/>
        <set attributeName="opacity" to="0" begin="2.2s"/>
      </text>
      <text x="815" y="333" class="percent" text-anchor="end" opacity="0">2.6%
        <set attributeName="opacity" to="1" begin="2.2s"/>
        <set attributeName="opacity" to="0" begin="2.6s"/>
      </text>
      <text x="815" y="333" class="percent" text-anchor="end" opacity="0">3.9%
        <set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/>
      </text>
    </g>

    <!-- Other 5% -->
    <g class="row-in" style="animation-delay:1.3s">
      <text x="70" y="375" class="label">EJS</text>
      <rect x="280" y="365" width="480" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
      <rect x="280" y="365" width="0" height="8" rx="4" fill="#94A3B8" filter="url(#barGlow)">
        <animate attributeName="width" from="0" to="2.24" begin="2.0s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
      </rect>
      <text x="815" y="375" class="percent" text-anchor="end" opacity="0">0.2%
        <set attributeName="opacity" to="1" begin="2.0s"/>
        <set attributeName="opacity" to="0" begin="2.4s"/>
      </text>
      <text x="815" y="375" class="percent" text-anchor="end" opacity="0">0.5%
        <set attributeName="opacity" to="1" begin="2.4s"/>
        <set attributeName="opacity" to="0" begin="2.8s"/>
      </text>
      <text x="815" y="375" class="percent" text-anchor="end" opacity="0">0.7%
        <set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/>
      </text>
    </g>

    <!-- divider -->
    <line x1="70" y1="396" x2="830" y2="396" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>

    <!-- BOTTOM: Primary Stack pills -->
    <text x="70" y="413" class="stackLabel">PRIMARY STACK</text>

    <g class="pill" style="animation-delay:3.1s">
      <rect x="70" y="424" width="70" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#38BDF8" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="105" y="445" class="pillText" text-anchor="middle">React</text>
    </g>

    <g class="pill" style="animation-delay:3.25s">
      <rect x="154" y="424" width="90" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#06B6D4" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="199" y="445" class="pillText" text-anchor="middle">FastAPI</text>
    </g>

    <g class="pill" style="animation-delay:3.4s">
      <rect x="258" y="424" width="90" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#60A5FA" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="303" y="445" class="pillText" text-anchor="middle">Node.js</text>
    </g>

    <g class="pill" style="animation-delay:3.55s">
      <rect x="362" y="424" width="120" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#38BDF8" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="422" y="445" class="pillText" text-anchor="middle">PostgreSQL</text>
    </g>

    <g class="pill" style="animation-delay:3.7s">
      <rect x="496" y="424" width="70" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#06B6D4" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="531" y="445" class="pillText" text-anchor="middle">Redis</text>
    </g>

    <g class="pill" style="animation-delay:3.85s">
      <rect x="580" y="424" width="130" height="34" rx="17" fill="#0F172A" fill-opacity="0.55" stroke="#60A5FA" stroke-opacity="0.6" filter="url(#pillGlow)"/>
      <text x="645" y="445" class="pillText" text-anchor="middle">React Native</text>
    </g>
  </g>
</svg>
